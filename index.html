<style>
  :root{ --sand:#E8DCC4; --saffron:#E3A23B; --date:#6B4226; --ink:#2a1f16; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b130d;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink)}
  #scene{position:fixed;inset:0;touch-action:none}
  #scene canvas{display:block}
  .bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 10px calc(env(safe-area-inset-left) + 12px);
    background:linear-gradient(to bottom,rgba(27,19,13,.85),rgba(27,19,13,0));pointer-events:none}
  .brand{color:var(--sand);font-weight:700;font-size:18px;margin-inline-end:auto;display:flex;align-items:center;gap:8px;text-shadow:0 1px 3px #000}
  .brand small{font-weight:400;opacity:.75;font-size:12px}
  .bar button{pointer-events:auto}
  .btn{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(232,220,196,.35);background:rgba(43,31,22,.72);
    color:var(--sand);font:600 14px 'IBM Plex Sans Arabic',sans-serif;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn.on{background:var(--saffron);color:#2a1f16;border-color:var(--saffron)}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;
    background:rgba(255,250,240,.95);border-radius:12px;padding:4px 10px 5px;font-size:13px;font-weight:700;line-height:1.35;
    box-shadow:0 3px 10px rgba(0,0,0,.35);border-top:4px solid var(--c);display:flex;flex-direction:column;align-items:center}
  .tag .n{display:flex;align-items:center;gap:5px}
  .tag .r{font-weight:600;font-size:11px;color:var(--c);filter:brightness(.8)}
  .tag .dot{width:8px;height:8px;border-radius:50%}
  .tag.hidden{display:none}
  @media (max-width:600px){ .tag{font-size:11px;padding:3px 7px 4px} .tag .r{font-size:9.5px} }
  #sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;background:#fffaf0;border-radius:22px 22px 0 0;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 30px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .35s ease}
  #sheet.open{transform:translateY(0)}
  @media (min-width:900px){
    #sheet{left:auto;right:16px;top:90px;bottom:16px;width:380px;max-height:none;border-radius:22px;transform:translateX(120%)}
    #sheet.open{transform:translateX(0)}
  }
  .sh-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .avatar{width:54px;height:54px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;flex:none}
  .sh-head h2{margin:0;font-size:20px}
  .sh-head p{margin:2px 0 0;font-size:13px;opacity:.75}
  .close{margin-inline-start:auto;min-width:44px;min-height:44px;border-radius:50%;border:none;background:#eee3cf;font-size:20px;cursor:pointer}
  .quote{background:#f3e9d6;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
  #sheet h3{font-size:14px;margin:14px 0 6px;color:var(--date)}
  #sheet ul{margin:0;padding-inline-start:20px;font-size:14px;line-height:1.7}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:12px;background:#eee3cf}
  .copy{width:100%;min-height:48px;margin-top:16px;border:none;border-radius:14px;background:var(--c);color:#fff;font:700 15px 'IBM Plex Sans Arabic',sans-serif;cursor:pointer}
  #crew{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(to top,rgba(27,19,13,.9),rgba(27,19,13,0));scrollbar-width:none;justify-content:center}
  #crew::-webkit-scrollbar{display:none}
  .mem{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px 4px 6px;border-radius:24px;border:none;cursor:pointer;
    background:rgba(255,250,240,.95);font:700 13px 'IBM Plex Sans Arabic',sans-serif;color:#2a1f16}
  .mem i{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;display:grid;place-items:center;font-size:15px}
  @media (max-width:600px){ #crew{justify-content:flex-start} }
  #order{width:100%;margin-top:10px;border:1.5px solid #e2d3b8;border-radius:14px;padding:12px;font:15px 'IBM Plex Sans Arabic',sans-serif;background:#fff;resize:vertical;min-height:96px;color:#2a1f16}
  #order:focus{outline:none;border-color:var(--saffron)}
  .quick .chip{border:none;cursor:pointer;font:600 13px 'IBM Plex Sans Arabic',sans-serif;min-height:36px;padding:6px 12px;background:#f3e9d6;color:#2a1f16}
  .ghost{width:100%;min-height:44px;margin-top:8px;border:1px solid #e2d3b8;border-radius:14px;background:transparent;font:600 14px 'IBM Plex Sans Arabic',sans-serif;cursor:pointer;color:#5a3820}
  .howto{font-size:12px;opacity:.7;margin:8px 0 0;line-height:1.6}
  details{margin-top:14px;font-size:14px} details summary{cursor:pointer;font-weight:700;color:var(--date);min-height:32px}
  #rpanel{position:fixed;z-index:7;background:#fffaf0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.45);
    left:0;right:0;bottom:0;height:70vh;border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 8px);transform:translateY(105%);transition:transform .35s ease}
  #rpanel.open{transform:none}
  @media (min-width:900px){ #rpanel{left:auto;right:16px;top:84px;bottom:16px;height:auto;width:440px;border-radius:22px;transform:translateX(120%)} #rpanel.open{transform:none} }
  .rhead{display:flex;align-items:center;gap:10px}
  .rhead h2{margin:0;font-size:18px} .rhead p{margin:2px 0 0;font-size:12px;opacity:.7}
  .rtabs{display:flex;gap:6px;margin:12px 0 8px;background:#f3e9d6;border-radius:14px;padding:4px}
  .rtabs button{flex:1;min-height:40px;border:none;border-radius:10px;background:transparent;font:700 14px 'IBM Plex Sans Arabic',sans-serif;color:#5a3820;cursor:pointer}
  .rtabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);color:#2a1f16}
  .rbody{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;padding-bottom:6px}
  .rlog{display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px}
  .msg{max-width:88%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.7;position:relative}
  .msg.steven{background:#fff;border:1px solid #eadcc2;align-self:flex-start;border-top-right-radius:4px}
  .msg.steven b{display:block;font-size:12px;color:#b07a2b;margin-bottom:2px}
  .msg.me{background:#E3A23B;color:#2a1f16;align-self:flex-end;border-top-left-radius:4px}
  .mini{margin-top:6px;border:1px solid #e2d3b8;background:#fbf6ec;border-radius:10px;padding:4px 10px;font:600 12px 'IBM Plex Sans Arabic';cursor:pointer;min-height:32px}
  .rcomp{border-top:1px solid #eadcc2;padding-top:8px}
  .who{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none} .who::-webkit-scrollbar{display:none}
  .pick{flex:none;min-height:36px;border:1px solid #e2d3b8;background:#fff;border-radius:18px;padding:4px 12px;font:600 13px 'IBM Plex Sans Arabic';cursor:pointer;color:#2a1f16}
  .pick.on{background:#2a1f16;color:#fff;border-color:#2a1f16}
  #rtext{width:100%;border:1.5px solid #e2d3b8;border-radius:14px;padding:10px 12px;font:15px 'IBM Plex Sans Arabic',sans-serif;resize:none;background:#fff;color:#2a1f16}
  #rtext:focus{outline:none;border-color:#E3A23B}
  .ract{display:flex;gap:8px;margin-top:8px}
  .rbtn{flex:1;min-height:46px;border-radius:14px;border:1px solid #e2d3b8;background:#fff;font:700 14px 'IBM Plex Sans Arabic';cursor:pointer;color:#5a3820}
  .rbtn.main{background:#2a1f16;color:#fff;border-color:#2a1f16}
  .mcard{border:1px solid #eadcc2;border-inline-start:5px solid var(--c);border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
  .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px} .mh span{font-size:12px;opacity:.65}
  .task{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #efe3cc;font-size:14px;flex-wrap:wrap}
  .task .tx{flex:1;min-width:140px} .task i{font-style:normal;font-size:11px;background:#f3e9d6;border-radius:8px;padding:1px 6px;margin-inline-start:4px}
  .task.done .tx{opacity:.55;text-decoration:line-through}
  .st{min-width:58px;min-height:32px;border:none;border-radius:10px;font:700 12px 'IBM Plex Sans Arabic';cursor:pointer;background:#f3e9d6;color:#5a3820}
  .task.doing .st{background:#fde7c2;color:#8a5a12} .task.done .st{background:#dff2e3;color:#2e7d4a}
  .del{border:none;background:transparent;font-size:18px;opacity:.4;cursor:pointer;min-width:32px;min-height:32px}
  .as{display:flex;gap:4px;width:100%} .as button{flex:1;min-height:32px;border:1px solid #e2d3b8;border-radius:10px;background:#fbf6ec;font:600 12px 'IBM Plex Sans Arabic';cursor:pointer}
  .prow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #efe3cc}
  .prow b{display:block;font-size:15px} .prow span{font-size:12px;opacity:.7}
  .pdot{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8c8aa;cursor:pointer}
  .note,.empty{font-size:13px;opacity:.65;margin:6px 2px} .rnote{font-size:11px;opacity:.55;margin:6px 0 0;text-align:center}
  #ropen{position:fixed;z-index:6;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);display:none;min-height:50px;padding:0 22px;border:none;border-radius:25px;background:#E3A23B;color:#2a1f16;font:700 15px 'IBM Plex Sans Arabic';box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer}
  #ropen.show{display:block}
  .login{padding:10px 4px} .login h3{margin:6px 0} .login p{font-size:14px;opacity:.8}
  #remail{width:100%;min-height:48px;border:1.5px solid #e2d3b8;border-radius:14px;padding:10px 12px;font:16px 'IBM Plex Sans Arabic';margin:8px 0 10px;direction:ltr;text-align:left}
  .login .rbtn{width:100%} .ok{color:#2e7d4a;font-weight:600}
  .run{min-height:32px;border:none;border-radius:10px;background:#2a1f16;color:#fff;font:700 12px 'IBM Plex Sans Arabic';padding:0 10px;cursor:pointer}
  .run:disabled,.rbtn:disabled{opacity:.45}
  .tnote{width:100%;min-height:34px;border:1px dashed #e2d3b8;border-radius:10px;padding:4px 10px;font:13px 'IBM Plex Sans Arabic';background:#fffdf8}
  .res{width:100%;background:#fbf6ec;border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.7} .res summary{font-weight:700;cursor:pointer;color:#2e7d4a}
  .msg.busy{opacity:.75;font-style:italic}
  .queued{font-size:12px;font-weight:700;color:#8a5a12;background:#fde7c2;border-radius:10px;padding:4px 8px}
  .ucard{background:#2a1f16;color:#f6eedf;border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .ucard b{display:inline-block;margin-inline-end:8px} .ucard span{font-size:11px;opacity:.6}
  .ubody{font-size:14px;line-height:1.75;margin-top:6px;max-height:34vh;overflow:auto} .muted{opacity:.6}
  .dcard{background:#fff;border:1px solid #eadcc2;border-radius:14px;padding:8px 12px;margin-bottom:10px}
  .dcard summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
  .dec{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed #efe3cc;font-size:14px} .dec span{flex:1} .dec.done span{opacity:.5;text-decoration:line-through}
  .pcard{background:#fff;border:1px solid #eadcc2;border-radius:14px;padding:8px 12px;margin-bottom:10px}
  .pcard summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
  .proj{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed #efe3cc;font-size:14px} .proj .pn{flex:1} .proj .pd{width:10px;height:10px;border-radius:50%;flex:none}
  .proj a{color:#1F4E79;font-weight:600;white-space:nowrap} .proj .na{font-size:12px;color:#a08a6c;white-space:nowrap}
  .acard{background:#fff7e6;border:2px solid #E3A23B;border-radius:14px;padding:8px 12px;margin-bottom:10px}
  .acard summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px}
  .acard .cnt{background:#d9534f;color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
  .ask{padding:9px 0;border-top:1px dashed #efd9ae;font-size:14px}
  .ask .meta{font-size:11px;color:#8a7356;margin-top:2px}
  .ask a{color:#1F4E79;font-weight:600;word-break:break-all}
  .ask .btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .ask .btns button{flex:1;min-height:36px;border-radius:10px;border:1px solid #e2d3b8;background:#fff;font:600 13px 'IBM Plex Sans Arabic';cursor:pointer}
  .ask .ok{background:#3cb371!important;color:#fff;border-color:#3cb371!important}
  .ask .no{color:#b03a2e}
  .ask textarea{width:100%;margin-top:6px;border:1px solid #e2d3b8;border-radius:10px;padding:8px;font:14px 'IBM Plex Sans Arabic';box-sizing:border-box}
  .ask.answered{opacity:.6} .ask.answered .st{font-weight:700}
  .linkb{border:none;background:none;color:#8a5a12;font:600 12px 'IBM Plex Sans Arabic';padding:6px 0;cursor:pointer}
  .msg small{display:block;font-size:10px;opacity:.5;margin-top:4px}
  .bad{color:#b3261e;font-weight:600;font-size:13px}
  .hint{position:fixed;z-index:4;bottom:calc(env(safe-area-inset-bottom) + 76px);left:50%;transform:translateX(-50%);
    background:rgba(27,19,13,.75);color:var(--sand);padding:8px 14px;border-radius:16px;font-size:13px;white-space:nowrap;transition:opacity .6s}
  #loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#1b130d;color:var(--sand);font-size:18px;transition:opacity .6s}
  #loading.gone{opacity:0;pointer-events:none}
  #err{display:none;position:fixed;inset:auto 12px 12px 12px;z-index:11;background:#7a1e1e;color:#fff;padding:12px;border-radius:12px;font-size:13px}
</style>

<body>
<div id="loading">يتجهز المجلس…</div>
<div id="err"></div>
<div id="scene"></div>
<div id="labels"></div>
<div class="bar">
  <div class="brand">مجلس خلفان <small>المرحلة ١ • v6.2</small></div>
  <button class="btn on" id="bMajlis">المجلس</button>
  <button class="btn" id="bCoffee">قهوة المغرب</button>
  <button class="btn" id="bTop">منظر علوي</button>
  <button class="btn" id="bRozna">⭐ الروزنة</button>
</div>
<div class="hint" id="hint">اسحب للتدوير • قرّب بإصبعين أو العجلة • اضغط على أي عضو</div>
<nav id="crew" aria-label="الفريق"></nav>
<aside id="rpanel" aria-label="روزنة المدير العام"></aside>
<button id="ropen">⭐ افتح مكتب ستيفن</button>
<aside id="sheet" aria-live="polite"></aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= البيانات ================= */
const TEAM = [
  { id:'steven', name:'ستيفن خلفان', role:'المدير العام', color:'#E3A23B', emoji:'⭐', quote:'يلا يا فريق، وين وصلنا؟',
    duties:['يحدد الرؤية والأولويات','يعتمد القرارات والهويات والنشر','يحاسب على نجاح المشاريع'], projects:['كل المحفظة'], status:'green' },
  { id:'michael', name:'مايكل خلفان', role:'التقنية والمشاريع', color:'#1F4E79', emoji:'🔵', quote:'خلّنا نقسمها مراحل.',
    duties:['خطط المشاريع والمواصفات التقنية والكود','📡 رادار الذكاء الاصطناعي اليومي','🧰 صيّاد الـ Skills والـ Connectors الأسبوعي','🛠️ بناء أدوات الفريق','🔐 الأمان','📋 متابعة مهام الفريق كله'],
    projects:['محل (تقني)','مجلس خلفان 3D','مكتب ستيفن','الأكاديمية','Project X','Thor'], status:'yellow' },
  { id:'jennifer', name:'جنيفر خلفان', role:'التسويق والإعلانات', color:'#6E4AA8', emoji:'🟣', quote:'وش الهدف؟ ومين الجمهور؟',
    duties:['استراتيجية وخطط المحتوى','📊 Media Buyer وتحليل الإعلانات','🔁 الـ Funnels ومسارات التحويل','✍️ الكتابة التسويقية','تقارير النتائج من بيانات حقيقية'],
    projects:['محل (تسويق)','AI Minute','@stevenkhalfan','Explore Oman'], status:'green' },
  { id:'christina', name:'كرستينا خلفان', role:'التصميم والإبداع', color:'#2F6B5A', emoji:'🟢', quote:'خلّني أشوفه على الجوال أول.',
    duties:['حارسة الهويات والكاركترات','التصاميم والواجهات','🎬 المونتاج الكامل','🔎 رصد الترندات البصرية','✅ موافقة الجودة قبل النشر'],
    projects:['هوية محل','AI Minute','مجلس خلفان 3D','الأكاديمية'], status:'green' },
  { id:'matthew', name:'ماثيو خلفان', role:'المكتب والمالية', color:'#6B4226', emoji:'🟤', quote:'خلّنا نرتّب وقتك أول.',
    duties:['🗓️ جدول الدوام والدراسة والمشاريع','📧 موجز الإيميلات ومسودات الردود','💰 الاشتراكات والتجديدات','💵 دخل AI Minute ومحل','تقرير مالي شهري'],
    projects:['الدراسة (الجدولة)','المالية العامة'], status:'green' },
];
const BY = Object.fromEntries(TEAM.map(t=>[t.id,t]));

/* ================= الأساس ================= */
const host=document.getElementById('scene');
const isMobile=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.75:2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,420);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI*0.47; controls.minDistance=3; controls.maxDistance=130; controls.screenSpacePanning=false;

const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??0.85,metalness:o.m??0,emissive:o.e??0x000000,emissiveIntensity:o.ei??1,transparent:!!o.t,opacity:o.t??1,side:o.side??THREE.FrontSide,map:o.map??null});

function rbox(w,h,d,r,m){ // صندوق بحواف دائرية بسيطة
  const s=new THREE.Shape(); const x=-w/2,y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d); s.quadraticCurveTo(x,y+d,x,y+d-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelThickness:Math.min(r,h/3),bevelSize:Math.min(r,h/3),bevelSegments:3});
  g.rotateX(-Math.PI/2); g.translate(0,-h/2,0); return new THREE.Mesh(g,m);
}
function canvasTex(w,h,draw,rep){

  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); } return t;
}

    hpath.moveTo(cx-r,sill); hpath.lineTo(cx+r,sill); hpath.lineTo(cx+r,top-r); hpath.absarc(cx,top-r,r,0,Math.PI,false); hpath.lineTo(cx-r,sill); s.holes.push(hpath); }
  return new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:0.5,bevelEnabled:false}),mat(0xf6efe2,{r:.95}));
}

  for(let i=0;i<60;i++){ const x=(i*97)%w, y=(i*53)%h, c=cs[i%5]; g.fillStyle=c; g.beginPath(); g.ellipse(x,y,16,9,(i%7)*0.6,0,7); g.fill(); g.strokeStyle=c; g.lineWidth=3; g.beginPath(); g.arc(x+12,y-6,9,0,4); g.stroke(); }
  g.strokeStyle='#c9566b'; g.lineWidth=4; for(let y=8;y<h;y+=64){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); } },[2,1]); }
function stripeTex(base,line){ return canvasTex(256,256,(g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); g.fillStyle=line; for(let x=0;x<w;x+=16) g.fillRect(x,0,4,h); },[3,2]); }

function eye(head,x,y,iris,size=1,lashes=false){
  const g=new THREE.Group(); const z=Math.sqrt(Math.max(0,R*R-x*x-y*y))-0.02;
  const wht=sph(0.105*size,mat(0xffffff,{r:.25})); wht.scale.set(0.95,1.12,0.55); g.add(wht);
  const ir=new THREE.Mesh(new THREE.CircleGeometry(0.068*size,24),mat(iris,{r:.3})); at(ir,0,-0.005,0.06*size); g.add(ir);
  const pu=new THREE.Mesh(new THREE.CircleGeometry(0.035*size,20),mat(0x0d0a08,{r:.2})); at(pu,0,-0.005,0.062*size); g.add(pu);
  const hl=new THREE.Mesh(new THREE.CircleGeometry(0.018*size,12),new THREE.MeshBasicMaterial({color:0xffffff})); at(hl,0.022*size,0.025*size,0.064*size); g.add(hl);
  if(lashes){ const l=cap(0.012,0.16*size,mat(0x1a1210)); l.rotation.z=Math.PI/2; at(l,0,0.095*size,0.035); g.add(l);
    const tip=cap(0.01,0.05,mat(0x1a1210)); tip.rotation.z=Math.PI/2+(x>0?-0.6:0.6); at(tip,(x>0?1:-1)*0.1*size,0.1*size,0.03); g.add(tip); }
  g.position.set(x,y,z); g.rotation.y=Math.asin(x/R)*0.9; g.rotation.x=-Math.asin(y/R)*0.6; head.add(g);
}
function mouth(head,y,open=true,w=0.12){
  const z=Math.sqrt(R*R-y*y)+0.004;
  const s=new THREE.Shape(); s.moveTo(-w,0); s.quadraticCurveTo(0,open?-w*1.1:-w*0.55,w,0); s.quadraticCurveTo(0,open?-w*0.15:-w*0.3,-w,0);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s,12),new THREE.MeshBasicMaterial({color:open?0x6b2626:0x9a4a42})); at(m,0,y,z); m.rotation.x=-0.25; head.add(m);
  if(open){ const t=new THREE.Shape(); t.moveTo(-w*0.8,-0.004); t.quadraticCurveTo(0,-w*0.32,w*0.8,-0.004); t.quadraticCurveTo(0,-w*0.12,-w*0.8,-0.004);
    const te=new THREE.Mesh(new THREE.ShapeGeometry(t,10),new THREE.MeshBasicMaterial({color:0xffffff})); at(te,0,y,z+0.002); te.rotation.x=-0.25; head.add(te); }
}
function makeHead(o){
  // o: skin, iris, brow, beard:'goatee'|'full'|null, hair, female, glasses, eyeSize, open

  const sk=sph(R,skin,32); sk.scale.set(1,1.06,0.98); head.add(sk);
  const jaw=sph(R*0.82,skin,24); jaw.scale.set(1,0.8,0.95); at(jaw,0,-0.16,0.02); head.add(jaw);
  const nose=sph(0.055,skin,16); nose.scale.set(0.95,0.9,1.15); at(nose,0,-0.05,R-0.005); head.add(nose);
  if(!o.female){ [-1,1].forEach(s=>{ const e=sph(0.085,skin,14); e.scale.set(0.45,1,0.75); at(e,s*(R-0.01),-0.02,-0.02); head.add(e); }); }
  const es=o.eyeSize||1;
  eye(head,-0.15,0.04,o.iris,es,!!o.female); eye(head,0.15,0.04,o.iris,es,!!o.female);
  const browM=mat(o.brow,{r:.8});
  [-1,1].forEach(s=>{ const b=cap(o.female?0.014:0.026,0.13,browM); b.rotation.z=Math.PI/2+s*(o.female?0.12:0.08); const by=0.17+(o.female?0.02:0); at(b,s*0.15,by,Math.sqrt(R*R-0.15*0.15-by*by)+0.01); b.rotation.y=s*0.35; head.add(b); });
  mouth(head,-0.19,o.open!==false,o.female?0.085:0.11);
  if(o.female){ [-1,1].forEach(s=>{ const c=new THREE.Mesh(new THREE.CircleGeometry(0.06,16),new THREE.MeshBasicMaterial({color:0xf08c8c,transparent:true,opacity:.38})); const cx=s*0.23, cy=-0.08; at(c,cx,cy,Math.sqrt(R*R-cx*cx-cy*cy)+0.006); c.rotation.y=Math.asin(cx/R); head.add(c); }); }
  if(o.hair){ const hm=mat(o.hair,{r:.9}); const hs=new THREE.Mesh(new THREE.SphereGeometry(R*1.03,32,16,Math.PI/2+1.05,Math.PI*2-2.1,0,1.75),hm); at(hs,0,0.02,-0.01); hs.scale.set(1,1.06,0.98); head.add(hs);
    [-1,1].forEach(s=>{ const sb=box(0.05,0.16,0.08,hm); at(sb,s*(R-0.02),-0.06,0.1); head.add(sb); }); }
  if(o.beard){ const bm=mat(o.hair||0x1a1410,{r:.9});
    const jl=new THREE.Mesh(new THREE.TorusGeometry(R*0.86,o.beard==='full'?0.05:0.028,8,32,Math.PI),bm); jl.rotation.x=Math.PI/2+0.35; at(jl,0,-0.2,0.02); head.add(jl);
    const go=sph(o.beard==='full'?0.09:0.065,bm,14); go.scale.set(1.1,1,0.7); at(go,0,-0.36,0.28); head.add(go);
    const mu=cap(o.beard==='full'?0.028:0.02,0.12,bm); mu.rotation.z=Math.PI/2; at(mu,0,-0.125,R-0.01); head.add(mu);
    if(o.beard==='full'){ const ch=sph(0.24,bm,16); ch.scale.set(1.2,0.55,0.7); at(ch,0,-0.32,0.16); head.add(ch); } }
  if(o.glasses){ const gm=mat(0x1c1c1c,{r:.3}); [-1,1].forEach(s=>{ const r=new THREE.Mesh(new THREE.TorusGeometry(0.11,0.016,8,24),gm); at(r,s*0.15,0.04,R+0.02); r.rotation.y=s*0.25; head.add(r);
    const arm=box(0.012,0.012,0.36,gm); at(arm,s*0.27,0.06,0.2); head.add(arm); }); const br=cap(0.012,0.05,gm); br.rotation.z=Math.PI/2; at(br,0,0.06,R+0.03); head.add(br); }
  return head;
}
function kumma(head,accent,second){
  const side=new THREE.MeshStandardMaterial({map:kummaTex(accent,second),roughness:.85}); const top=new THREE.MeshStandardMaterial({map:kummaTopTex(accent),roughness:.85});
  const k=new THREE.Mesh(new THREE.CylinderGeometry(R*0.93,R*0.97,0.3,40,1,false),[side,top,top]); at(k,0,R*0.72,-0.02); k.rotation.x=-0.08; head.add(k);
}
function massar(head){
  const t=massarTex(); const m=new THREE.MeshStandardMaterial({map:t,roughness:.9});
  for(let i=0;i<3;i++){ const tor=new THREE.Mesh(new THREE.TorusGeometry(R*0.9-i*0.04,0.11-i*0.01,12,36),m); tor.rotation.x=Math.PI/2+0.12-i*0.05; tor.rotation.z=i*0.4; at(tor,0,R*0.55+i*0.11,-0.03); head.add(tor); }
  const dome=sph(R*0.88,m,28); dome.scale.set(1,0.55,1); at(dome,0,R*0.82,-0.04); head.add(dome);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.25,12),m); tail.rotation.z=-1.1; at(tail,R*0.95,R*0.7,-0.05); head.add(tail);
}
function hijab(head,color,drape=false){
  const m=mat(color,{r:.9,side:THREE.DoubleSide}); const Rh=R*1.1;
  const shell=new THREE.Mesh(new THREE.SphereGeometry(Rh,40,28,Math.PI/2+0.95,Math.PI*2-1.9,0,Math.PI*0.82),m); shell.scale.set(1,1.06,1); at(shell,0,0.0,-0.02); head.add(shell);
  const topc=new THREE.Mesh(new THREE.SphereGeometry(Rh,40,12,0,Math.PI*2,0,0.82),m); topc.scale.set(1,1.06,1); at(topc,0,0.0,-0.02); head.add(topc);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(R*0.93,0.03,8,40,Math.PI*1.2),m); rim.rotation.z=-Math.PI*0.1; at(rim,0,0.02,R*0.42); rim.scale.set(1,1.14,1); rim.rotation.x=-0.05; head.add(rim);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.3,drape?0.62:0.48,drape?0.75:0.55,32,1,true),m); at(neck,0,-R-0.18-(drape?0.12:0),0); head.add(neck);
  const chin=sph(0.3,m,24); chin.scale.set(1.05,0.6,0.9); at(chin,0,-R-0.02,0.05); head.add(chin);
}

function robeGeo(seated,wide=0.52){
  const pts = seated
    ? [[0,0],[0.68,0],[0.74,0.12],[0.66,0.26],[0.48,0.38],[0.42,0.62],[0.44,0.86],[0.4,0.98],[0.24,1.08],[0.13,1.12],[0,1.12]]
    : [[0,0.1],[wide,0.1],[wide-0.03,0.5],[0.43,1.05],[0.45,1.38],[0.41,1.55],[0.24,1.66],[0.13,1.7],[0,1.7]];
  const g=new THREE.LatheGeometry(pts.map(([x,y])=>new THREE.Vector2(x,y)),48); g.scale(seated?1.15:1,1,seated?0.98:0.8); return g;
}
function arms(g,sy,sleeveM,skin,o={}){
  const hm=mat(skin,{r:.55});
  [-1,1].forEach(s=>{ const pivot=new THREE.Group(); at(pivot,s*0.44,sy-0.1,0); g.add(pivot);
    const sl=new THREE.Mesh(new THREE.CylinderGeometry(0.12,o.wide?0.24:0.15,0.78,20),sleeveM); at(sl,0,-0.39,0); pivot.add(sl);
    if(o.trim){ const t=new THREE.Mesh(new THREE.TorusGeometry(o.wide?0.235:0.145,0.018,6,24),o.trim); t.rotation.x=Math.PI/2; at(t,0,-0.77,0); pivot.add(t); }
    const hand=sph(0.1,hm,16); hand.scale.set(0.8,1.1,0.65); at(hand,0,-0.86,0.01); pivot.add(hand);
    const th=cap(0.03,0.06,hm); th.rotation.z=s*0.5; at(th,-s*0.06,-0.82,0.05); pivot.add(th);
    pivot.rotation.z=s*(o.spread??0.1); pivot.rotation.x=o.forward??0;
    if(s===1) g.userData.rArm=pivot; else g.userData.lArm=pivot; });
}
function sandals(g,skin){
  const sm=mat(skin,{r:.55}), blk=mat(0x1a1a1a,{r:.5});
  [-1,1].forEach(s=>{ const sole=rbox(0.2,0.05,0.42,0.06,blk); at(sole,s*0.15,0.025,0.16); g.add(sole);
    const ft=cap(0.07,0.2,sm); ft.rotation.x=Math.PI/2; at(ft,s*0.15,0.09,0.17); g.add(ft);
    const st=new THREE.Mesh(new THREE.TorusGeometry(0.08,0.022,6,16,Math.PI),blk); st.rotation.y=Math.PI/2; at(st,s*0.15,0.08,0.2); g.add(st); st.rotation.z=0; });
}
function omaniRobe(g,seated,color,trimColor,skin){

  [-1,1].forEach(s=>{ const ln=box(0.014,0.48,0.012,tm); at(ln,s*0.035,sy-0.2,(seated?0.43:0.35)+0.012); ln.rotation.x=-0.07; g.add(ln); });
  const bt=box(0.084,0.014,0.012,tm); at(bt,0,sy-0.44,(seated?0.43:0.36)+0.012); g.add(bt);
  const str=cyl(0.008,0.008,0.38,tm,6); at(str,0.08,sy-0.04,0.33); str.rotation.z=0.12; g.add(str);
  const tas=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.12,10),tm); tas.rotation.x=Math.PI; at(tas,0.1,sy-0.27,0.34); g.add(tas);
  arms(g,sy,rm,skin,{trim:tm, forward:seated?-0.55:0, spread:seated?0.18:0.1});
  if(!seated){ const ht=new THREE.Mesh(new THREE.TorusGeometry(0.515,0.012,6,48),tm); ht.rotation.x=Math.PI/2; ht.scale.set(1,0.8,1); at(ht,0,0.14,0); g.add(ht); }

function neckAndHead(g,sy,skin,headOpts){
  const nk=cyl(0.12,0.13,0.2,mat(skin,{r:.55}),16); at(nk,0,sy+0.12,0); g.add(nk);
  const head=makeHead(headOpts); at(head,0,sy+0.2+R*0.95,0.02); g.add(head); g.userData.head=head; return head;
}

    rp.querySelector('#rgo').onclick=go; rp.querySelector('#rpin').onkeydown=e=>{ if(e.key==='Enter') go(); };
    return;
  }
  const active=RS.decisions.filter(d=>d.status==='active'), done=RS.decisions.filter(d=>d.status!=='active');
  const upd=RS.update;
  rp.innerHTML=headHTML()+`<div class="rbody">
    ${ERRS[rErr]?`<p class="bad">${ERRS[rErr]}</p>`:''}
    <div class="ucard"><b>📋 آخر أبديت من ستيفن</b>${upd?`<span>${fmtT(upd.created_at)}</span><div class="ubody">${esc(upd.body).replace(/\n/g,'<br>')}</div>`:'<div class="ubody muted">أول أبديت يوصلك في جولة الصبح.</div>'}</div>
    ${asksHTML()}
    ${projectsHTML()}
    <details class="dcard" ${active.length?'open':''}><summary>✅ القرارات (${active.length})</summary>
      ${active.map(d=>`<div class="dec"><span>${esc(d.body)}</span><button class="mini" data-dd="${d.id}" title="تم">✓</button></div>`).join('')||'<p class="empty">ما فيه قرارات مفتوحة.</p>'}
      ${done.length?`<button class="linkb" id="rshowdone">${showDone?'إخفاء':'عرض'} المنفّذة (${done.length})</button>${showDone?done.map(d=>`<div class="dec done"><span>${esc(d.body)}</span></div>`).join(''):''}`:''}
    </details>
    <div class="rlog" id="rlog">${RS.messages.map(m=>`<div class="msg ${m.sender==='me'?'me':'steven'}">${m.sender!=='me'?'<b>⭐ ستيفن</b>':''}<div>${esc(m.body).replace(/\n/g,'<br>')}</div><small>${fmtT(m.created_at)}</small></div>`).join('')||'<p class="empty">ابدأ الكلام مع ستيفن: قرار، أبديت، أو طلب.</p>'}
      ${RS.pending?`<div class="msg steven busy"><b>⭐ ستيفن</b>استلمت ✓ برد عليك وأوزّع على الشباب في الجولة الجاية.</div>`:''}</div>
  </div>
  <div class="rcomp"><textarea id="rtext" rows="2" placeholder="اكتب لستيفن… قرار، أبديت، أو طلب"></textarea>
    <div class="ract"><button class="rbtn main" id="rsend" ${rState==='sending'?'disabled':''}>${rState==='sending'?'…':'أرسل لستيفن ←'}</button></div></div>`;
  bindHead();
  rp.querySelector('#rsend').onclick=async()=>{ const ta=rp.querySelector('#rtext'); const v=ta.value.trim(); if(!v){ ta.focus(); return; } rState='sending'; renderRozna(); await refresh({action:'send',text:v}); rState='idle'; renderRozna(); };
  rp.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>refresh({action:'decision',id:+b.dataset.dd,status:'done'}));
  const sd=rp.querySelector('#rshowdone'); if(sd) sd.onclick=()=>{ showDone=!showDone; renderRozna(); };
  bindAsks();
  const bd=rp.querySelector('.rbody'); if(bd && !noteOpen && !(RS.asks||[]).some(a=>a.status==='pending')) bd.scrollTop=bd.scrollHeight;
}
function startPoll(){ stopPoll(); timer=setInterval(()=>{ if(!document.hidden&&rp.classList.contains('open')&&rState==='idle'&&noteOpen===null&&!document.activeElement?.matches?.('#rtext')) refresh(); },60000); }
function stopPoll(){ if(timer) clearInterval(timer); timer=null; }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&rp.classList.contains('open')&&getPin()) refresh(); });
function openRozna(){ renderRozna(); rp.classList.add('open'); rOpen.classList.remove('show'); if(getPin()){ refresh(); startPoll(); } }
rOpen.onclick=openRozna;

/* ================= الملصقات والتفاعل ================= */
const labelsEl=document.getElementById('labels'); const tags={};
function mkTag(t,key){ const d=document.createElement('div'); d.className='tag'; d.style.setProperty('--c',t.color);
  const dot=t.status==='yellow'?'#e0b13b':t.status==='red'?'#d9534f':'#3cb371';
  d.innerHTML=`<span class="n"><span class="dot" style="background:${dot}"></span>${t.name}</span><span class="r">${t.role}</span>`;
  d.addEventListener('click',e=>{ e.stopPropagation(); openSheet(t.id); }); labelsEl.appendChild(d); tags[key]=d; }
TEAM.forEach(t=>{ mkTag(t,'m_'+t.id); mkTag(t,'c_'+t.id); });
const crew=document.getElementById('crew');
TEAM.forEach(t=>{ const b=document.createElement('button'); b.className='mem'; b.style.setProperty('--c',t.color); b.innerHTML=`<i>${t.name[0]}</i>${t.name.split(' ')[0]}`; b.onclick=()=> t.id==='steven' ? setMode('rozna') : openSheet(t.id); crew.appendChild(b); });
const sheet=document.getElementById('sheet');
const PROJECT_URL='https://claude.ai/project/01a1f36a-a5f0-7218-83ae-684fe18dccf1';
const QUICK={
  steven:['وين وصلنا؟','الموجز','اجتمعوا في قهوة المغرب عن '],
  michael:['الرادار','أدوات جديدة','سوّ خطة تقنية لـ محل للأسابيع الأربعة الجاية','حدّث مجلس خلفان: '],
  jennifer:['سوّي خطة محتوى أسبوع لـ AI Minute','اكتبي كابشن لبوست عن ','حللي أداء آخر بوستات AI Minute','خطة دخل AI Minute للوصول 1000$'],
  christina:['صمّمي بوست لحساب دقيقة ذكاء اصطناعي عن ','سكربت ريل 30 ثانية لـ AI Minute عن ','صمّمي ستوري لـ محل عن ','راجعي هذا التصميم: '],
  matthew:['جدولي','البريد','الحسابات','رتّب لي وقت هالأسبوع بين الدوام والدراسة والمشاريع'],
};
function buildOrder(t,task){
  const who = t.id==='steven' ? '☕ الفريق كامل' : `${t.emoji} ${t.name}`;
  return `${who}: ${task.trim()}\n\n— أمر من مجلس خلفان. نفّذه كامل بنفسك حسب «دليل تشغيل فريق خلفان»، استخدم الأدوات المتاحة (مثل Canva للتصميم والبحث للأخبار)، وسلّمني النتيجة جاهزة بالقالب المناسب. اسألني فقط إذا ناقصك شي يغيّر النتيجة.`;
}
function openSheet(id){ if(id==='steven'){ setMode('rozna'); return; } const t=BY[id];
  sheet.innerHTML=`<div class="sh-head"><div class="avatar" style="--c:${t.color}">${t.name[0]}</div><div><h2>${t.emoji} ${t.name}</h2><p>${t.role}</p></div><button class="close" aria-label="إغلاق">×</button></div>
    <div class="quote">«${t.quote}»</div>
    <h3>${id==='steven'?'أمر للفريق':'وش تبي من '+t.name.split(' ')[0]+'؟'}</h3>
    <div class="chips quick">${QUICK[id].map(q=>`<button class="chip qbtn" type="button">${q.trim()}</button>`).join('')}</div>
    <textarea id="order" rows="4" placeholder="اكتب أمرك هنا… مثلاً: سوّيلي كذا وعطني كذا"></textarea>
    <button class="copy" id="send" style="--c:${t.color}">أرسل الأمر ← افتح المشروع</button>
    <button class="ghost" id="quick">أو افتح محادثة سريعة بالأمر</button>
    <p class="howto">يتنسخ الأمر، وتفتح صفحة مشروع «Khalfan Majlis». ابدأ محادثة جديدة والصق (اضغط مطولًا ← لصق).</p>
    <details><summary>المهام والمشاريع</summary><ul>${t.duties.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="chips">${t.projects.map(x=>`<span class="chip">${x}</span>`).join('')}</div></details>`;
  const ta=sheet.querySelector('#order');
  try{ ta.value=localStorage.getItem('order_'+id)||''; }catch{}
  ta.oninput=()=>{ try{ localStorage.setItem('order_'+id,ta.value); }catch{} };
  sheet.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{ ta.value=b.textContent+(b.textContent.endsWith('عن')||b.textContent.endsWith(':')?' ':''); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); ta.oninput(); });
  sheet.querySelector('.close').onclick=closeSheet;
  const go=async(url,btn)=>{ const task=ta.value.trim(); if(!task){ ta.focus(); ta.placeholder='اكتب الأمر أول 👆'; return; }
    const order=buildOrder(t,task); let cp=null; try{ cp=navigator.clipboard.writeText(order); }catch{}
    const a=document.createElement('a'); a.href=url(order); a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
    let ok=false; try{ await cp; ok=!!cp; }catch{}
    btn.textContent= ok ? '✓ انتسخ — الصقه في المحادثة' : 'انسخ النص من الخانة يدويًا';
    if(!ok){ ta.value=order; ta.select(); } else { try{ localStorage.removeItem('order_'+id); }catch{} } };
  sheet.querySelector('#send').onclick=e=>go(()=>PROJECT_URL,e.target);
  sheet.querySelector('#quick').onclick=e=>go(o=>'https://claude.ai/new?q='+encodeURIComponent(o),e.target);
  sheet.classList.add('open'); focusOn(id); }
function closeSheet(){ sheet.classList.remove('open'); }

let mode='majlis', tween=null;
function flyTo(pos,target,ms=1100){ tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...pos),t1:new THREE.Vector3(...target),start:performance.now(),ms}; }
const portrait=()=>innerWidth<innerHeight;
function viewFor(m){
  const asp=innerWidth/innerHeight, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const k=clamp(1.85/asp,1,3.4), k2=clamp(1.6/asp,1,2.6);
  const hh=Math.atan(Math.tan(camera.fov*Math.PI/360)*asp);
  if(m==='rozna') return asp<1 ? {pos:[RX,4.6,12.5],target:[RX,-0.9,-1.6]} : (innerWidth>=900 ? {pos:[RX+2.6,4.6,8.6],target:[RX+2.6,1.2,-2]} : {pos:[RX,4.6,8.6],target:[RX,1.2,-2]});
  if(asp<1 && m==='majlis'){ const d=11.8/Math.tan(hh), el=0.98; return {pos:[0,0.6+d*Math.sin(el),1+d*Math.cos(el)],target:[0,0.6,1]}; }
  if(asp<1 && m==='coffee'){ const d=4.9/Math.tan(hh), el=0.8; return {pos:[120,0.6+d*Math.sin(el),-0.3+d*Math.cos(el)],target:[120,0.6,-0.3]}; }
  if(m==='majlis') return {pos:[0,14*k,1.5+21*k],target:[0,0.6,1]};
  if(m==='top') return {pos:[0,34*clamp(1.4/asp,1,2.4),0.01],target:[0,0,0]};
  return {pos:[120,7.2*k2,9.8*k2],target:[120,0.6,-0.6]};
}
function setMode(m){ mode=m; majlis.visible=(m==='majlis'||m==='top'); coffee.visible=m==='coffee'; rozna.visible=m==='rozna';
  document.getElementById('crew').style.display=m==='rozna'?'none':'';
  if(m==='rozna'){ openRozna(); } else { rp.classList.remove('open'); rOpen.classList.remove('show'); }
  controls.maxPolarAngle=m==='top'?0.01:Math.PI*0.47; controls.enableRotate=m!=='top';
  scene.background=m==='coffee'?null:new THREE.Color(0x1b130d);
  ['bMajlis','bCoffee','bTop','bRozna'].forEach(b=>document.getElementById(b).classList.remove('on'));
  document.getElementById({majlis:'bMajlis',coffee:'bCoffee',top:'bTop',rozna:'bRozna'}[m]).classList.add('on');
  const v=viewFor(m); flyTo(v.pos,v.target); closeSheet(); }
function focusOn(id){ if(mode==='top') return; const list=mode==='coffee'?coffeeChars:majlisChars; const c=list.find(x=>x.userData.id===id); if(!c) return;
  const p=new THREE.Vector3(); c.getWorldPosition(p); const f=new THREE.Vector3(0,0,1).applyQuaternion(c.quaternion).setY(0).normalize();
  const dist=mode==='coffee'?3.4:4.6, h=mode==='coffee'?1.6:2.4;
  flyTo([p.x+f.x*dist,p.y+h,p.z+f.z*dist],[p.x,p.y+(mode==='coffee'?1.1:1.6),p.z],900); }
document.getElementById('bMajlis').onclick=()=>setMode('majlis');
document.getElementById('bCoffee').onclick=()=>setMode('coffee');
document.getElementById('bTop').onclick=()=>setMode('top');
document.getElementById('bRozna').onclick=()=>setMode('rozna');

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>8) return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera);
  if(mode==='rozna'){ if(ray.intersectObjects(roznaChars,true)[0]) openRozna(); return; }
  const targets=mode==='coffee'?coffeeChars:[...majlisChars,coffeeSign]; const hit=ray.intersectObjects(targets,true)[0];
  if(!hit){ closeSheet(); return; } if(hit.object.userData.go==='coffee'){ setMode('coffee'); return; } if(hit.object.userData.id) openSheet(hit.object.userData.id); });

const v3=new THREE.Vector3(); const clk=new THREE.Clock();
function placeTags(){ const list=mode==='rozna'?[]:mode==='coffee'?coffeeChars.map(c=>['c_',c]):majlisChars.map(c=>['m_',c]);
  Object.values(tags).forEach(d=>d.classList.add('hidden'));
  for(const [pre,c] of list){ c.getWorldPosition(v3); v3.y+=(c.userData.seated?2.35:3.0); v3.project(camera); if(v3.z>1) continue;
    const d=tags[pre+c.userData.id]; d.style.left=((v3.x+1)/2*innerWidth)+'px'; d.style.top=((1-v3.y)/2*innerHeight)+'px'; d.classList.remove('hidden'); } }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){ const t=clk.getElapsedTime();
  if(tween){ const k=Math.min(1,(performance.now()-tween.start)/tween.ms), e=ease(k); camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(k>=1) tween=null; }
  for(const c of (mode==='coffee'?coffeeChars:mode==='rozna'?roznaChars:majlisChars)){ const b=c.userData.body, ph=c.userData.phase;
    b.scale.y=1+Math.sin(t*1.8+ph)*0.008; if(b.userData.head){} const h=b.userData.head; if(h){ h.rotation.y=Math.sin(t*0.5+ph)*0.15; h.rotation.z=Math.sin(t*0.7+ph)*0.03; }
    if(c.userData.drone){ const d=c.userData.drone; d.position.y=2.6+Math.sin(t*2+ph)*0.15; d.position.x=Math.cos(t*0.8)*0.95; d.position.z=0.3+Math.sin(t*0.8)*0.5; d.rotation.y=t; } }
  if(mode!=='coffee') smoke.forEach((s,i)=>{ const k=((t*0.35+i/5)%1); s.position.y=0.5+k*1.6; s.position.x=2.6+Math.sin(k*6+i)*0.12; s.material.opacity=0.35*(1-k); s.scale.setScalar(1+k*1.5); });
  controls.update(); renderer.render(scene,camera); placeTags(); requestAnimationFrame(loop); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ if(!sheet.classList.contains('open')){ const v=viewFor(mode); flyTo(v.pos,v.target,500);} },250); });
scene.background=new THREE.Color(0x1b130d);
{ const v=viewFor('majlis'); camera.position.set(...v.pos); controls.target.set(...v.target); }
loop();
document.getElementById('loading').classList.add('gone');
setTimeout(()=>{ document.getElementById('hint').style.opacity=0; },6000);
</script>
<script>
  addEventListener('error',e=>{ if(!e.message) return; const el=document.getElementById('err'); el.style.display='block'; el.textContent='صار خطأ في تحميل المشهد: '+e.message; },true);
  setTimeout(()=>{ const l=document.getElementById('loading'); if(l && !l.classList.contains('gone')) l.textContent='التحميل أخذ وقت… تأكد من الإنترنت وحدّث الصفحة'; },12000);
</script>
